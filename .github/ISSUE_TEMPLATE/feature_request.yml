name: Feature request
description: Suggest a capability or an improvement to the investigation loop
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can a user not do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Which pack or API surface changes?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - required for the core loop
        - P1 - differentiator
        - P2 - optional
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How would we know it works?
      description: Which test or observation would prove the feature?
    validations:
      required: true
